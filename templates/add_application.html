<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Application | JobAnalyzer</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f8f5;
            color: #163a5f;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 72px;

            background: #c7d6e8;
            border-bottom: 1px solid #a9bfd7;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
        }

        .logo {
            text-decoration: none;
            color: #163a5f;

            font-size: 24px;
            font-weight: 800;
        }

        .logo span {
            color: #245b91;
        }

        .back-dashboard {
            text-decoration: none;

            color: #294968;

            font-size: 14px;
            font-weight: 600;

            display: flex;
            align-items: center;
            gap: 7px;
        }

        .back-dashboard:hover {
            color: #163a5f;
        }

        /* =========================
           PAGE
        ========================= */

        .page-container {
            max-width: 900px;

            margin: 0 auto;

            padding: 45px 25px 60px;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            color: #163a5f;

            font-size: 30px;

            margin-bottom: 8px;
        }

        .page-header p {
            color: #64748b;

            font-size: 14px;
        }

        /* =========================
           FORM CARD
        ========================= */

        .form-card {
            background: #ffffff;

            border: 1px solid #e2e8f0;

            border-radius: 16px;

            padding: 32px;

            box-shadow:
                0 8px 25px rgba(22, 58, 95, 0.06);
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 9px;

            color: #163a5f;

            font-size: 16px;
            font-weight: 700;

            padding-bottom: 13px;

            margin-bottom: 20px;

            border-bottom: 1px solid #e2e8f0;
        }

        .section-title i {
            color: #245b91;
        }

        /* =========================
           FORM GRID
        ========================= */

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;

            color: #294968;

            font-size: 13px;
            font-weight: 700;

            margin-bottom: 8px;
        }

        .required {
            color: #dc2626;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;

            border: 1px solid #cbd5e1;
            border-radius: 9px;

            background: #ffffff;

            color: #163a5f;

            font-family: inherit;
            font-size: 14px;

            outline: none;

            transition: 0.2s ease;
        }

        .form-input,
        .form-select {
            height: 46px;

            padding: 0 13px;
        }

        .form-textarea {
            min-height: 150px;

            padding: 13px;

            resize: vertical;

            line-height: 1.6;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: #94a3b8;
        }

        /* =========================
           BUTTONS
        ========================= */

        .form-actions {
            display: flex;

            justify-content: flex-end;

            gap: 12px;

            margin-top: 30px;

            padding-top: 25px;

            border-top: 1px solid #e2e8f0;
        }

        .cancel-btn,
        .submit-btn {
            height: 45px;

            padding: 0 20px;

            border-radius: 9px;

            font-size: 13px;
            font-weight: 700;

            text-decoration: none;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .cancel-btn {
            background: #ffffff;

            border: 1px solid #cbd5e1;

            color: #475569;
        }

        .cancel-btn:hover {
            background: #f8fafc;
        }

        .submit-btn {
            background: #245b91;

            border: 1px solid #245b91;

            color: #ffffff;
        }

        .submit-btn:hover {
            background: #163f68;

            border-color: #163f68;

            transform: translateY(-1px);
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 650px) {

            .navbar {
                padding: 0 5%;
            }

            .page-container {
                padding: 30px 15px 45px;
            }

            .page-header h1 {
                font-size: 26px;
            }

            .form-card {
                padding: 24px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .cancel-btn,
            .submit-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">

        <a href="/" class="logo">
            Job<span>Analyzer</span>
        </a>

        <a
            href="{{ url_for('dashboard') }}"
            class="back-dashboard"
        >
            <i class="bi bi-arrow-left"></i>
            Back to Dashboard
        </a>

    </nav>


    <!-- =========================
         PAGE
    ========================= -->

    <main class="page-container">

        <div class="page-header">

            <h1>Add Job Application</h1>

            <p>
                Keep track of a new job opportunity and its details.
            </p>

        </div>


        <!-- =========================
             FORM
        ========================= -->

        <div class="form-card">

            <form
                method="POST"
                action="{{ url_for('add_application') }}"
            >

                <!-- =========================
                     BASIC INFORMATION
                ========================= -->

                <div class="form-section">

                    <div class="section-title">

                        <i class="bi bi-briefcase"></i>

                        Job Information

                    </div>


                    <div class="form-grid">

                        <!-- Company -->

                        <div class="form-group">

                            <label for="company">
                                Company
                                <span class="required">*</span>
                            </label>

                            <input
                                type="text"
                                id="company"
                                name="company"
                                class="form-input"
                                placeholder="e.g. TCS"
                                required
                            >

                        </div>


                        <!-- Job Title -->

                        <div class="form-group">

                            <label for="job_title">
                                Job Title
                                <span class="required">*</span>
                            </label>

                            <input
                                type="text"
                                id="job_title"
                                name="job_title"
                                class="form-input"
                                placeholder="e.g. Python Developer"
                                required
                            >

                        </div>


                        <!-- Location -->

                        <div class="form-group">

                            <label for="location">
                                Location
                            </label>

                            <input
                                type="text"
                                id="location"
                                name="location"
                                class="form-input"
                                placeholder="e.g. Bangalore / Remote"
                            >

                        </div>


                        <!-- Job Type -->

                        <div class="form-group">

                            <label for="job_type">
                                Job Type
                            </label>

                            <select
                                id="job_type"
                                name="job_type"
                                class="form-select"
                            >

                                <option value="">
                                    Select job type
                                </option>

                                <option value="Full-time">
                                    Full-time
                                </option>

                                <option value="Part-time">
                                    Part-time
                                </option>

                                <option value="Internship">
                                    Internship
                                </option>

                                <option value="Contract">
                                    Contract
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <!-- =========================
                     APPLICATION DETAILS
                ========================= -->

                <div class="form-section">

                    <div class="section-title">

                        <i class="bi bi-calendar-check"></i>

                        Application Details

                    </div>


                    <div class="form-grid">

                        <!-- Application Date -->

                        <div class="form-group">

                            <label for="application_date">
                                Application Date
                                <span class="required">*</span>
                            </label>

                            <input
                                type="date"
                                id="application_date"
                                name="application_date"
                                class="form-input"
                                required
                            >

                        </div>


                        <!-- Status -->

                        <div class="form-group">

                            <label for="status">
                                Status
                                <span class="required">*</span>
                            </label>

                            <select
                                id="status"
                                name="status"
                                class="form-select"
                                required
                            >

                                <option value="Applied">
                                    Applied
                                </option>

                                <option value="Interview">
                                    Interview
                                </option>

                                <option value="Selected">
                                    Selected
                                </option>

                                <option value="Rejected">
                                    Rejected
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <!-- =========================
                     JOB DESCRIPTION
                ========================= -->

                <div class="form-section">

                    <div class="section-title">

                        <i class="bi bi-file-text"></i>

                        Job Description

                    </div>


                    <div class="form-group">

                        <label for="job_description">
                            Job Description
                        </label>

                        <textarea
                            id="job_description"
                            name="job_description"
                            class="form-textarea"
                            placeholder="Paste the job description here. We'll use this later for skill analysis."
                        ></textarea>

                    </div>

                </div>


                <!-- =========================
                     NOTES
                ========================= -->

                <div class="form-section">

                    <div class="section-title">

                        <i class="bi bi-sticky"></i>

                        Notes

                    </div>


                    <div class="form-group">

                        <label for="notes">
                            Personal Notes
                        </label>

                        <textarea
                            id="notes"
                            name="notes"
                            class="form-textarea"
                            placeholder="Add anything you want to remember about this application..."
                        ></textarea>

                    </div>

                </div>


                <!-- =========================
                     ACTIONS
                ========================= -->

                <div class="form-actions">

                    <a
                        href="{{ url_for('dashboard') }}"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="submit-btn"
                    >
                        <i class="bi bi-check-lg"></i>
                        &nbsp;Save Application
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>
</html>
